# Activated via SPRING_PROFILES_ACTIVE=docker when this service runs as a container inside the
# sentinelops-net Compose network — connects to other services by their container names instead
# of host-published localhost ports.
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/${POSTGRES_DB:sentinelops}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:redpanda:9092}

sentinelops:
  telemetry:
    prometheus:
      base-url: ${PROMETHEUS_URL:http://prometheus:9090}
    loki:
      base-url: ${LOKI_URL:http://loki:3100}
    tempo:
      base-url: ${TEMPO_URL:http://tempo:3200}
