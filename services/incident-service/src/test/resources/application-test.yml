# Overrides for Testcontainers-backed tests. Datasource/Kafka connection details are injected
# at runtime via @DynamicPropertySource in the relevant base test classes.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: incidents,audit,runbooks
    default-schema: incidents

sentinelops:
  security:
    # issuer and spring.security.oauth2.resourceserver.jwt.jwk-set-uri are overridden per-test via
    # @DynamicPropertySource once the Keycloak Testcontainer is up (see AbstractIntegrationTest).
    issuer: http://placeholder-overridden-by-dynamicpropertysource
    audience: sentinelops-incident-api
    cors-allowed-origins: []
    metrics:
      username: metrics-test
      password: metrics-test-password
  incident-service:
    producer-name: incident-service-test
    max-request-body-bytes: 1048576
    outbox:
      polling-interval: 500ms
      batch-size: 50
      max-attempts: 3
      initial-backoff: 200ms
      max-backoff: 2s
      retention-after-publish: 24h
      lease-duration: 2s
      publish-timeout: 3s
      backoff-jitter: 0.2
    consumer:
      max-retries: 3
      retry-initial-interval: 200ms
      retry-max-interval: 2s
      retry-multiplier: 2.0
      retry-jitter: 0.2
      processed-event-retention: 1s
      processed-event-cleanup-interval: 500ms
  ai:
    enabled: true
    provider: deterministic
    embedding-provider: deterministic
    ollama:
      base-url: http://localhost:11434
      model: llama3.2
      embedding-model: nomic-embed-text
      timeout: 5s
      max-retries: 1
    retrieval:
      backend: in-memory
      top-k: 5
      min-score: 0.2
    circuit-breaker:
      failure-threshold: 3
      open-duration: 5s
    rate-limit:
      cooldown: 0s
    prompt:
      max-description-chars: 4000
      max-passage-chars: 1500
      template-version: v1

logging:
  level:
    com.sentinelops: DEBUG
