# SentinelOps incident-service configuration.
#
# Defaults assume the service is run directly on the host (e.g. `./mvnw spring-boot:run`)
# against the Phase 2 infrastructure's host-published ports. See application-docker.yml for
# the profile used when this service itself runs inside the Compose network.
server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: incident-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # Local-only SMTP sink (Mailpit — see docker-compose's "mailpit" service): no real email is
  # ever sent, and no authentication/TLS is configured because Mailpit accepts plain local SMTP.
  mail:
    host: ${MAILPIT_HOST:localhost}
    port: ${MAILPIT_SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sentinelops}
    username: ${POSTGRES_APP_USER:sentinelops_app}
    password: ${POSTGRES_APP_PASSWORD:change-me-local-dev-only}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
      pool-name: incident-service-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    schemas: incidents,audit,runbooks,alerts
    default-schema: incidents
    locations: classpath:db/migration
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: incident-service
      auto-offset-reset: earliest
    producer:
      acks: all
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Address to fetch Keycloak's signing keys from (JWKS). Kept separate from the expected
          # "iss" claim value below — see sentinelops.security.issuer and SecurityConfig#jwtDecoder.
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:8180/realms/sentinelops/protocol/openid-connect/certs}

sentinelops:
  security:
    # The issuer string Keycloak itself embeds in every token (its fixed KC_HOSTNAME) — must match
    # exactly regardless of which network address was used to fetch the token or its signing keys.
    issuer: ${OAUTH2_ISSUER_URI:http://localhost:8180/realms/sentinelops}
    # Must match the audience ("aud" claim) the Keycloak client's audience mapper adds to every
    # access token it issues for this API — see infrastructure/docker/keycloak/realm-export.json.
    audience: ${OAUTH2_AUDIENCE:sentinelops-incident-api}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    metrics:
      username: ${ACTUATOR_METRICS_USERNAME:metrics}
      password: ${ACTUATOR_METRICS_PASSWORD:change-me-local-dev-only}
  incident-service:
    producer-name: incident-service
    max-request-body-bytes: ${MAX_REQUEST_BODY_BYTES:1048576}
    outbox:
      polling-interval: ${OUTBOX_POLLING_INTERVAL:2s}
      batch-size: ${OUTBOX_BATCH_SIZE:50}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
      initial-backoff: ${OUTBOX_INITIAL_BACKOFF:1s}
      max-backoff: ${OUTBOX_MAX_BACKOFF:60s}
      retention-after-publish: ${OUTBOX_RETENTION_AFTER_PUBLISH:24h}
      # How long a claimed-but-not-yet-published row is protected from being re-claimed by
      # another publisher instance — must comfortably exceed publish-timeout.
      lease-duration: ${OUTBOX_LEASE_DURATION:30s}
      # Maximum time to wait for a single Kafka send to complete.
      publish-timeout: ${OUTBOX_PUBLISH_TIMEOUT:10s}
      # Fractional random jitter applied to the computed retry backoff (0.0 disables jitter).
      backoff-jitter: ${OUTBOX_BACKOFF_JITTER:0.2}
    consumer:
      max-retries: ${ANOMALY_CONSUMER_MAX_RETRIES:5}
      retry-initial-interval: ${ANOMALY_CONSUMER_RETRY_INITIAL_INTERVAL:1s}
      retry-max-interval: ${ANOMALY_CONSUMER_RETRY_MAX_INTERVAL:30s}
      retry-multiplier: ${ANOMALY_CONSUMER_RETRY_MULTIPLIER:2.0}
      retry-jitter: ${ANOMALY_CONSUMER_RETRY_JITTER:0.2}
      # How long a processed-event idempotency record is kept before cleanup. Must comfortably
      # exceed the broker's topic retention (see REDPANDA_TOPIC_RETENTION_MS) so a message that
      # is somehow redelivered after a long delay is still recognized as a duplicate.
      processed-event-retention: ${ANOMALY_CONSUMER_PROCESSED_EVENT_RETENTION:8d}
      processed-event-cleanup-interval: ${ANOMALY_CONSUMER_PROCESSED_EVENT_CLEANUP_INTERVAL:1h}
  # AI-assisted incident triage (Phase 11). Disabled by default: this is an optional, human-
  # reviewed assistance feature, never required for the core application. See
  # docs/development/ai-triage.md.
  ai:
    enabled: ${AI_TRIAGE_ENABLED:false}
    provider: ${AI_PROVIDER:deterministic}
    embedding-provider: ${AI_EMBEDDING_PROVIDER:deterministic}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3.2}
      embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      timeout: ${AI_OLLAMA_TIMEOUT:20s}
      max-retries: ${AI_OLLAMA_MAX_RETRIES:2}
    retrieval:
      backend: ${AI_RETRIEVAL_BACKEND:pgvector}
      top-k: ${AI_RETRIEVAL_TOP_K:5}
      min-score: ${AI_RETRIEVAL_MIN_SCORE:0.2}
    circuit-breaker:
      failure-threshold: ${AI_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
      open-duration: ${AI_CIRCUIT_BREAKER_OPEN_DURATION:30s}
    rate-limit:
      cooldown: ${AI_RATE_LIMIT_COOLDOWN:10s}
    prompt:
      max-description-chars: ${AI_PROMPT_MAX_DESCRIPTION_CHARS:4000}
      max-passage-chars: ${AI_PROMPT_MAX_PASSAGE_CHARS:1500}
      template-version: v1
  # External alert ingestion, deduplication, correlation, routing, notification, and escalation
  # (Phase 12). See docs/development/alert-ingestion.md.
  alerts:
    ingestion:
      max-labels: ${ALERTS_MAX_LABELS:50}
      max-annotations: ${ALERTS_MAX_ANNOTATIONS:50}
      max-label-key-length: ${ALERTS_MAX_LABEL_KEY_LENGTH:100}
      max-label-value-length: ${ALERTS_MAX_LABEL_VALUE_LENGTH:500}
      max-alert-name-length: ${ALERTS_MAX_ALERT_NAME_LENGTH:200}
      max-summary-length: ${ALERTS_MAX_SUMMARY_LENGTH:500}
      max-description-length: ${ALERTS_MAX_DESCRIPTION_LENGTH:2000}
      max-payload-bytes: ${ALERTS_MAX_PAYLOAD_BYTES:1048576}
      max-future-skew: ${ALERTS_MAX_FUTURE_SKEW:5m}
      max-past-age: ${ALERTS_MAX_PAST_AGE:30d}
      supported-schema-versions: [1]
    hmac:
      # Never checked into source control with a real value — see .env.example.
      current-secret-id: ${ALERTS_WEBHOOK_HMAC_CURRENT_SECRET_ID:current}
      current-secret: ${ALERTS_WEBHOOK_HMAC_CURRENT_SECRET:change-me-local-dev-only}
      previous-secret-id: ${ALERTS_WEBHOOK_HMAC_PREVIOUS_SECRET_ID:}
      previous-secret: ${ALERTS_WEBHOOK_HMAC_PREVIOUS_SECRET:}
      replay-window: ${ALERTS_WEBHOOK_HMAC_REPLAY_WINDOW:5m}
    alertmanager:
      shared-token: ${ALERTS_ALERTMANAGER_SHARED_TOKEN:change-me-local-dev-only}
    rate-limit:
      max-requests-per-window: ${ALERTS_RATE_LIMIT_MAX_REQUESTS:100}
      window: ${ALERTS_RATE_LIMIT_WINDOW:1m}
    correlation:
      window: ${ALERTS_CORRELATION_WINDOW:30m}
      max-candidates: ${ALERTS_CORRELATION_MAX_CANDIDATES:50}
    notification:
      incident-link-base-url: ${ALERTS_INCIDENT_LINK_BASE_URL:http://localhost:5173}
      webhook-sink-url: ${ALERTS_WEBHOOK_SINK_URL:}
      email-from: ${ALERTS_NOTIFICATION_EMAIL_FROM:}
      email-to: ${ALERTS_NOTIFICATION_EMAIL_TO:}
      max-attempts: ${ALERTS_NOTIFICATION_MAX_ATTEMPTS:6}
      initial-backoff: ${ALERTS_NOTIFICATION_INITIAL_BACKOFF:2s}
      max-backoff: ${ALERTS_NOTIFICATION_MAX_BACKOFF:2m}
      backoff-jitter: ${ALERTS_NOTIFICATION_BACKOFF_JITTER:0.2}
      polling-interval: ${ALERTS_NOTIFICATION_POLLING_INTERVAL:2s}
      batch-size: ${ALERTS_NOTIFICATION_BATCH_SIZE:20}
    escalation:
      polling-interval: ${ALERTS_ESCALATION_POLLING_INTERVAL:15s}
      batch-size: ${ALERTS_ESCALATION_BATCH_SIZE:20}
    routing:
      rules:
        - id: sev1-immediate
          version: 1
          severity: SEV1
          route:
            team: platform-oncall
            channels: [EMAIL, WEBHOOK, IN_APP]
            escalation-delay: 5m
            queue-ai-triage: true
            suppress: false
        - id: sev2-standard
          version: 1
          severity: SEV2
          route:
            team: platform-oncall
            channels: [WEBHOOK, IN_APP]
            escalation-delay: 15m
            queue-ai-triage: true
            suppress: false
        - id: low-severity-in-app-only
          version: 1
          severity: SEV4
          route:
            team: platform-team
            channels: [IN_APP]
            escalation-delay: 0s
            queue-ai-triage: false
            suppress: false
      default-route:
        team: unassigned
        channels: [IN_APP]
        escalation-delay: 0s
        queue-ai-triage: false
        suppress: false
      business-hours:
        zone-id: ${ALERTS_BUSINESS_HOURS_ZONE:UTC}
        start-hour: 9
        end-hour: 17
  # Secure MCP server (Phase 13). Network transport is disabled by default — see
  # docs/development/mcp-server.md's "how to disable MCP network access" section. The stdio
  # transport (see McpStdioLauncher) is a separate process, launched explicitly, and is
  # unaffected by this flag.
  mcp:
    network-transport-enabled: ${MCP_NETWORK_TRANSPORT_ENABLED:false}
    endpoint-path: ${MCP_ENDPOINT_PATH:/mcp}
    max-page-size: ${MCP_MAX_PAGE_SIZE:50}
    max-search-results: ${MCP_MAX_SEARCH_RESULTS:10}
    max-response-bytes: ${MCP_MAX_RESPONSE_BYTES:1048576}
    tool-timeout: ${MCP_TOOL_TIMEOUT:10s}
    rate-limit:
      max-requests-per-window: ${MCP_RATE_LIMIT_MAX_REQUESTS:60}
      window: ${MCP_RATE_LIMIT_WINDOW:1m}
      max-concurrent-tool-calls-per-actor: ${MCP_MAX_CONCURRENT_TOOL_CALLS:4}
  # Agent-proposal rate limiting (Phase 13, section 11) — applies to both MCP-created and
  # console-created proposals.
  proposals:
    max-per-actor-per-window: ${PROPOSALS_MAX_PER_ACTOR:10}
    window: ${PROPOSALS_WINDOW:10m}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        # Readiness fails (503) whenever PostgreSQL or the Kafka-compatible broker is
        # unreachable, in addition to the application's own readiness state — a load balancer
        # or orchestrator must stop sending traffic here until both dependencies recover.
        readiness:
          include: readinessState,db,kafkaConnectivity
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  metrics:
    tags:
      service: ${spring.application.name}
      environment: ${ENVIRONMENT:local}
  tracing:
    sampling:
      # Sample every request locally so traces are reliably visible in Tempo during
      # development. A real deployment should tune this down per traffic volume.
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}/v1/traces
    logging:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}/v1/logs
      transport: grpc
  opentelemetry:
    resource-attributes:
      deployment.environment: ${ENVIRONMENT:local}

# datasource-micrometer-spring-boot (on the classpath — see pom.xml) auto-instruments the
# DataSource bean with Micrometer Observation, emitting a "jdbc.query" span per statement
# (SQL text and connection-pool tags only — never bind parameter values) nested under
# whichever request/consumer span triggered it. No further configuration is required.

logging:
  structured:
    format:
      console: ecs
  level:
    com.sentinelops: ${LOG_LEVEL:INFO}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
