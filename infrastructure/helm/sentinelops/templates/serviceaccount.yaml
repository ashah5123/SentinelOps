{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sentinelops.serviceAccountName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sentinelops.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Least privilege: this service account is never bound to any Role/ClusterRole by this chart —
# the application never calls the Kubernetes API. automountServiceAccountToken is disabled
# below so a compromised pod cannot even read its own (unused) token.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
