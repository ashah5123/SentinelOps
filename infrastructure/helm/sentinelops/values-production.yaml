# Production overrides. Every hostname/ARN-shaped value below is a documented placeholder — see
# docs/development/production-deployment.md — never a real account identifier.
global:
  environment: production
  namespace: sentinelops
  imagePullSecrets:
    - name: sentinelops-registry-credentials

incidentService:
  replicaCount: 3
  autoscaling:
    minReplicas: 3
    maxReplicas: 12
  podDisruptionBudget:
    minAvailable: 2

telemetryCorrelationService:
  replicaCount: 2
  autoscaling:
    minReplicas: 2
    maxReplicas: 8
  podDisruptionBudget:
    minAvailable: 1

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/sentinelops-app

ingress:
  host: sentinelops.example.com
  tls:
    secretName: sentinelops-production-tls

externalDependencies:
  postgres:
    host: sentinelops-production.abcdef123456.us-east-1.rds.amazonaws.com
  redis:
    host: sentinelops-production.abcdef.ng.0001.use1.cache.amazonaws.com
  kafka:
    brokers: b-1.sentinelops-production.abcdef.c2.kafka.us-east-1.amazonaws.com:9092
  keycloak:
    issuerUri: https://auth.sentinelops.example.com/realms/sentinelops
