# SentinelOps local Redis configuration (development only).
# The authentication password is supplied separately via --requirepass on
# the container command, sourced from the REDIS_PASSWORD environment
# variable, so it is never baked into this file or a Docker image layer.

bind 0.0.0.0
protected-mode yes

# Local development persistence (append-only file).
appendonly yes
appendfsync everysec
dir /data

# Redis is a cache and coordination store in SentinelOps, not the system
# of record — the system of record is PostgreSQL. Evict least-recently-used
# keys once the memory limit is reached rather than rejecting writes.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Reasonable local defaults.
tcp-keepalive 300
timeout 0
