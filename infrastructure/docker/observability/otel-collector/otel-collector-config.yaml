# OpenTelemetry Collector configuration for the SentinelOps local observability stack.
#
# Receives OTLP telemetry (metrics, logs, traces) from the incident-service over the
# sentinelops-net Docker network only. Nothing in this file exports data outside the
# Compose network. For a development variant that also dumps telemetry to the collector's
# own console log, see otel-collector-config.dev.yaml (selected via the
# OTEL_COLLECTOR_CONFIG_FILE environment variable — see .env.example).
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 300
    spike_limit_mib: 80
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # Metrics: exposed as a Prometheus scrape target (see prometheus.yml's
  # "otel-collector" job). Nothing is pushed anywhere outside this container.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  # Traces: forwarded to Tempo's own OTLP receiver over the internal Docker network.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Logs: forwarded to Loki's native OTLP ingestion endpoint over the internal network.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
