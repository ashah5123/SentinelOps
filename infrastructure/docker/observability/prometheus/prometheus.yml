# Prometheus configuration for the SentinelOps local observability stack.
#
# Scrapes only services on the internal sentinelops-net Docker network. No remote_write
# and no external service discovery — this instance never sends data outside the local
# Compose environment.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector

  - job_name: incident-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["incident-service:8081"]
        labels:
          service: incident-service

  - job_name: telemetry-correlation-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["telemetry-correlation-service:8082"]
        labels:
          service: telemetry-correlation-service
