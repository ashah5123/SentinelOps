# Alerting rules for the SentinelOps local observability stack.
#
# Thresholds below are deliberately conservative defaults chosen for a single-instance,
# low-traffic local development environment. They are NOT production thresholds — a real
# deployment must derive thresholds from actual workload/SLO data per service (see
# docs/development/observability.md).
groups:
  - name: sentinelops-service-health
    rules:
      - alert: SentinelOpsIncidentServiceDown
        expr: up{job="incident-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: incident-service
        annotations:
          summary: "incident-service is unreachable"
          description: >-
            Prometheus has been unable to scrape incident-service for at least 1 minute.
            Check `make incident-logs` and container health.

      - alert: SentinelOpsHighHttp5xxRate
        expr: >
          sum(rate(http_server_requests_seconds_count{job="incident-service", outcome="SERVER_ERROR"}[5m]))
          /
          sum(rate(http_server_requests_seconds_count{job="incident-service"}[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
          service: incident-service
        annotations:
          summary: "Elevated HTTP 5xx rate on incident-service"
          description: >-
            More than 5% of incident-service HTTP responses over the last 5 minutes were
            5xx. Local-dev threshold only — tune per real workload.

      - alert: SentinelOpsHighRequestLatency
        expr: >
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket{job="incident-service"}[5m])) by (le)
          ) > 1
        for: 5m
        labels:
          severity: warning
          service: incident-service
        annotations:
          summary: "p95 request latency above 1s on incident-service"
          description: >-
            The 95th percentile HTTP request duration has exceeded 1 second for 5 minutes.
            Local-dev threshold only — tune per real workload/SLO.

  - name: sentinelops-kafka-and-outbox
    rules:
      - alert: SentinelOpsKafkaConsumerErrors
        expr: increase(spring_kafka_listener_seconds_count{job="incident-service", exception!="none"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: incident-service
        annotations:
          summary: "Kafka listener errors on incident-service"
          description: >-
            The anomaly-event Kafka listener has recorded at least one exception in the
            last 5 minutes. Check `make incident-logs` for the stack trace.

      - alert: SentinelOpsOutboxPublishFailures
        expr: increase(sentinelops_outbox_published_total{job="incident-service", outcome="failure"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: incident-service
        annotations:
          summary: "Transactional outbox publish failures"
          description: >-
            At least one outbox event failed to publish to Kafka in the last 5 minutes.
            Rows that exhaust their retry budget are marked FAILED and require manual
            inspection (see docs/development/local-platform.md).

      - alert: SentinelOpsAnomalyProcessingFailures
        expr: increase(sentinelops_anomaly_events_processed_total{job="incident-service", outcome="failed"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: incident-service
        annotations:
          summary: "Anomaly-event processing failures"
          description: >-
            At least one telemetry.anomaly.v1 event failed processing (raised an
            exception) in the last 5 minutes, distinct from duplicate-event no-ops.

  - name: sentinelops-telemetry-correlation
    rules:
      - alert: SentinelOpsTelemetryCorrelationServiceDown
        expr: up{job="telemetry-correlation-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: telemetry-correlation-service
        annotations:
          summary: "telemetry-correlation-service is unreachable"
          description: >-
            Prometheus has been unable to scrape telemetry-correlation-service for at
            least 1 minute. Check `make correlation-logs` and container health.

      - alert: SentinelOpsIngestionPollingFailures
        expr: increase(sentinelops_telemetry_polling_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: telemetry-correlation-service
        annotations:
          summary: "Telemetry ingestion polling failures"
          description: >-
            At least one polling cycle failed before persistence completed in the last
            5 minutes. Check `make correlation-logs` for the failing source (Prometheus,
            Loki, or Tempo) — a single source failing does not block the others.

      - alert: SentinelOpsCorrelationFailures
        expr: increase(sentinelops_telemetry_incidents_correlated_total{outcome="failed"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: telemetry-correlation-service
        annotations:
          summary: "Correlation-run failures"
          description: >-
            At least one incident.detected.v1 event failed correlation processing in
            the last 5 minutes, distinct from duplicate-event no-ops.

      - alert: SentinelOpsTelemetryOutboxPublishFailures
        expr: increase(sentinelops_telemetry_outbox_published_total{outcome="failure"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: telemetry-correlation-service
        annotations:
          summary: "Telemetry-correlation outbox publish failures"
          description: >-
            At least one incident.evidence.correlated.v1 event failed to publish to
            Kafka in the last 5 minutes.

      - alert: SentinelOpsBackendCircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 0m
        labels:
          severity: warning
          service: telemetry-correlation-service
        annotations:
          summary: "A telemetry backend circuit breaker is open"
          description: >-
            The circuit breaker for {{ $labels.name }} (prometheus, loki, or tempo) is
            open, meaning that backend has been failing and calls to it are
            temporarily short-circuited. Other backends continue to be ingested
            normally.

  # Phase 6: reliability/failure-recovery signals shared by both services' outbox and
  # consumer implementations. Thresholds are local-development defaults — see
  # docs/development/reliability.md for the operational runbook these alerts feed into.
  - name: sentinelops-reliability
    rules:
      - alert: SentinelOpsOutboxBacklogGrowing
        expr: sentinelops_outbox_backlog > 100
        for: 5m
        labels:
          severity: warning
          service: incident-service
        annotations:
          summary: "incident-service outbox backlog is growing"
          description: >-
            More than 100 outbox rows have been PENDING for at least 5 minutes. Usually
            means the broker is unreachable or persistently rejecting sends — see the
            "growing outbox backlog" runbook entry in docs/development/reliability.md.

      - alert: SentinelOpsOutboxOldestPendingTooOld
        expr: sentinelops_outbox_oldest_pending_age_seconds > 300
        for: 1m
        labels:
          severity: warning
          service: incident-service
        annotations:
          summary: "incident-service has an outbox row pending for over 5 minutes"
          description: >-
            The oldest still-PENDING outbox row is more than 5 minutes old. Also useful
            as a recovery-time signal: watch this value fall back toward zero after a
            broker outage ends.

      - alert: SentinelOpsConsumerDeadLetterAccumulation
        expr: increase(sentinelops_consumer_dead_lettered_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
          service: incident-service
        annotations:
          summary: "incident-service is routing records to a dead-letter topic"
          description: >-
            At least one consumed record was dead-lettered in the last 15 minutes — see
            the "dead-letter accumulation" runbook entry in docs/development/reliability.md
            for the inspection and replay procedure.

      - alert: SentinelOpsTelemetryOutboxBacklogGrowing
        expr: sentinelops_telemetry_outbox_backlog > 100
        for: 5m
        labels:
          severity: warning
          service: telemetry-correlation-service
        annotations:
          summary: "telemetry-correlation-service outbox backlog is growing"
          description: >-
            More than 100 outbox rows have been PENDING for at least 5 minutes.

      - alert: SentinelOpsTelemetryOutboxOldestPendingTooOld
        expr: sentinelops_telemetry_outbox_oldest_pending_age_seconds > 300
        for: 1m
        labels:
          severity: warning
          service: telemetry-correlation-service
        annotations:
          summary: "telemetry-correlation-service has an outbox row pending for over 5 minutes"
          description: >-
            The oldest still-PENDING outbox row is more than 5 minutes old.

      - alert: SentinelOpsTelemetryConsumerDeadLetterAccumulation
        expr: increase(sentinelops_telemetry_consumer_dead_lettered_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
          service: telemetry-correlation-service
        annotations:
          summary: "telemetry-correlation-service is routing records to a dead-letter topic"
          description: >-
            At least one consumed record was dead-lettered in the last 15 minutes.
