name: sentinelops

# SentinelOps local platform: Phase 2 data/event-streaming infrastructure, the Phase 3
# incident-service application, the Phase 5 telemetry-correlation-service (both behind the
# "app" Compose profile), and the Phase 4 observability stack (behind the "observability"
# Compose profile).
#
# Runs entirely on local resources with no paid APIs or cloud dependencies.
# All host port bindings are restricted to 127.0.0.1. See docs/development/
# local-platform.md, docs/development/observability.md, and services/incident-service/README.md
# for details on each component.

networks:
  sentinelops-net:
    name: sentinelops-net
    driver: bridge

volumes:
  postgres-data:
    name: sentinelops-postgres-data
  redis-data:
    name: sentinelops-redis-data
  redpanda-data:
    name: sentinelops-redpanda-data
  minio-data:
    name: sentinelops-minio-data
  prometheus-data:
    name: sentinelops-prometheus-data
  grafana-data:
    name: sentinelops-grafana-data
  loki-data:
    name: sentinelops-loki-data
  tempo-data:
    name: sentinelops-tempo-data
  alertmanager-data:
    name: sentinelops-alertmanager-data

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentinelops-postgres
    env_file:
      - ../../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [sentinelops-net]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  redis:
    image: redis:7.4.1-alpine
    container_name: sentinelops-redis
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks: [sentinelops-net]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    container_name: sentinelops-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:${REDPANDA_KAFKA_EXTERNAL_PORT:-19092}
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "127.0.0.1:${REDPANDA_KAFKA_EXTERNAL_PORT:-19092}:19092"
      - "127.0.0.1:${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [sentinelops-net]
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1.5G

  redpanda-topics-init:
    image: redpandadata/redpanda:v24.2.18
    container_name: sentinelops-redpanda-topics-init
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      REDPANDA_BROKERS: redpanda:9092
      REDPANDA_TOPIC_PARTITIONS: ${REDPANDA_TOPIC_PARTITIONS:-3}
      REDPANDA_TOPIC_RETENTION_MS: ${REDPANDA_TOPIC_RETENTION_MS:-604800000}
      REDPANDA_TOPIC_MAX_MESSAGE_BYTES: ${REDPANDA_TOPIC_MAX_MESSAGE_BYTES:-1048576}
    volumes:
      - ./redpanda/init-topics.sh:/scripts/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/scripts/init-topics.sh"]
    networks: [sentinelops-net]
    restart: "no"

  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: sentinelops-redpanda-console
    profiles: ["console"]
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:${REDPANDA_CONSOLE_PORT:-8080}:8080"
    networks: [sentinelops-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: sentinelops-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [sentinelops-net]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: sentinelops-keycloak
    profiles: ["app"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      # Fixes the issuer/backend URL Keycloak embeds in every token to this externally-reachable
      # address, regardless of whether a caller reached it via 127.0.0.1:8180 (host) or the
      # internal keycloak:8080 address (other Compose containers) — see
      # docs/development/security.md's "issuer vs. JWKS address" note and
      # incident-service's SecurityConfig#jwtDecoder, which relies on this being fixed.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [sentinelops-net]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  k6:
    image: grafana/k6:0.54.0
    container_name: sentinelops-k6
    profiles: ["benchmark"]
    entrypoint: ["k6"]
    volumes:
      - ./k6:/scripts:ro
      - ./k6/results:/results
    networks: [sentinelops-net]
    # No resource limits: a benchmark load generator should not itself be resource-starved by the
    # same limits applied to the services it is measuring. Run via
    # infrastructure/docker/scripts/benchmark-run.sh, never `docker compose up` (it must run to
    # completion and exit, like a one-shot job, not stay running).

  minio-bucket-init:
    image: minio/mc:RELEASE.2024-10-02T08-27-28Z
    container_name: sentinelops-minio-bucket-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio/init-buckets.sh:/scripts/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/scripts/init-buckets.sh"]
    networks: [sentinelops-net]
    restart: "no"

  incident-service:
    build:
      context: ../../services/incident-service
      dockerfile: Dockerfile
    image: sentinelops/incident-service:local
    container_name: sentinelops-incident-service
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-topics-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SERVER_PORT: 8081
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      # OTLP export targets the otel-collector container name directly; this works whether
      # or not the "observability" profile is currently running — if the collector is down,
      # the OTel SDK simply drops telemetry after a short timeout rather than failing requests.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # Reached over the internal Compose network; the issuer string embedded in tokens is fixed
      # to the externally-published address regardless (KC_HOSTNAME above) — see
      # docs/development/security.md.
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/sentinelops/protocol/openid-connect/certs
      OAUTH2_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8180}/realms/sentinelops
      OAUTH2_AUDIENCE: ${OAUTH2_AUDIENCE:-sentinelops-incident-api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ACTUATOR_METRICS_USERNAME: ${ACTUATOR_METRICS_USERNAME:-metrics}
      ACTUATOR_METRICS_PASSWORD: ${ACTUATOR_METRICS_PASSWORD:-change-me-local-dev-only}
    ports:
      - "127.0.0.1:${INCIDENT_SERVICE_PORT:-8081}:8081"
    networks: [sentinelops-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  postgres-schema-init:
    image: pgvector/pgvector:pg16
    container_name: sentinelops-postgres-schema-init
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
    volumes:
      - ./postgres/provisioning/telemetry-schema-init.sh:/scripts/telemetry-schema-init.sh:ro
    entrypoint: ["/bin/bash", "/scripts/telemetry-schema-init.sh"]
    networks: [sentinelops-net]
    restart: "no"

  telemetry-correlation-service:
    build:
      context: ../../services/telemetry-correlation-service
      dockerfile: Dockerfile
    image: sentinelops/telemetry-correlation-service:local
    container_name: sentinelops-telemetry-correlation-service
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      postgres-schema-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      redpanda-topics-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SERVER_PORT: 8082
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      TELEMETRY_MONITORED_SERVICES: ${TELEMETRY_MONITORED_SERVICES:-incident-service}
    ports:
      - "127.0.0.1:${TELEMETRY_CORRELATION_SERVICE_PORT:-8082}:8082"
    networks: [sentinelops-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: sentinelops-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector/${OTEL_COLLECTOR_CONFIG_FILE:-otel-collector-config.yaml}"]
    volumes:
      - ./observability/otel-collector:/etc/otel-collector:ro
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:13133"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks: [sentinelops-net]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: sentinelops-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks: [sentinelops-net]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  loki:
    image: grafana/loki:3.3.2
    container_name: sentinelops-loki
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks: [sentinelops-net]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  tempo:
    image: grafana/tempo:2.6.1
    container_name: sentinelops-tempo
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks: [sentinelops-net]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sentinelops-alertmanager
    profiles: ["observability"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9093/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks: [sentinelops-net]
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M

  grafana:
    image: grafana/grafana:11.4.0
    container_name: sentinelops-grafana
    profiles: ["observability"]
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-dev-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards/files:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    networks: [sentinelops-net]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
