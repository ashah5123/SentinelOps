name: CI

# No CI pipeline existed in this repository before Phase 7; this is added specifically so the new
# authentication/authorization/audit-logging tests (and every pre-existing test) run automatically
# on every change, rather than relying solely on local `make`/`mvnw` runs. GitHub-hosted runners
# provide Docker, so the Testcontainers- and local-Keycloak-backed integration tests run here even
# though they could not be executed in the environment this phase was authored in.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      extended_scenario:
        description: "Phase 8 opt-in extended benchmark scenario to run (leave default to skip)"
        type: choice
        default: none
        options:
          - none
          - paginated-reads
          - incident-creation
          - lifecycle-transitions
          - mixed-workload
          - burst-recovery

# Phase 9: cancel a still-running workflow for the same branch/PR once a newer commit supersedes
# it, so pushes to an active PR don't queue up redundant, obsolete runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: every job gets only what it actually needs, declared on the job itself
# (see each job below) rather than widened here. Ordinary pull-request validation never requires a
# repository secret or an external paid service — every job in this file runs on public,
# unauthenticated pulls/inputs only.
permissions:
  contents: read

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: make validate
        run: make validate

  static-analysis:
    name: Static analysis (SpotBugs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        service: [incident-service, telemetry-correlation-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - name: mvnw compile && spotbugs:check
        working-directory: services/${{ matrix.service }}
        run: |
          ./mvnw -B compile
          ./mvnw -B spotbugs:check

  incident-service:
    name: incident-service build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/incident-service/pom.xml
      # Covers unit tests, security/authN-authZ tests, transactional-outbox/idempotency
      # integration tests, and database migration validation (FlywayMigrationTest,
      # MigrationUpgradePathTest — see docs/development/operations.md's migration section) in one
      # pass: all are plain JUnit tests Maven Surefire/Failsafe discovers and runs as part of the
      # module's normal `verify` build, so a separate duplicate job would only waste runner time.
      #
      # Phase 11 (AI-assisted triage): the com.sentinelops.incident.ai.** unit/integration tests,
      # including AiEvaluationTest's retrieval/generation metrics, also run here automatically —
      # they use the deterministic provider and in-memory retrieval per
      # src/test/resources/application-test.yml, so this job needs neither Ollama nor a GPU nor
      # any paid API. A live-model evaluation against a real Ollama instance is intentionally not
      # part of this job (see docs/development/ai-triage.md's evaluation section) — it requires a
      # locally running model and is opt-in/manual only, never a CI gate.
      #
      # Phase 12 (alert ingestion/correlation/routing/notification): the
      # com.sentinelops.incident.alerts.** unit tests also run here automatically — Alertmanager
      # payload mapping, HMAC signing/verification (including replay-window and constant-time
      # comparison), fingerprinting, deduplication logic, correlation rules, routing rules
      # (including startup config validation), notification rendering, and escalation-cancellation
      # eligibility are all plain JUnit/Mockito tests needing no database, Kafka, or external
      # service. AlertsPropertiesBindingTest additionally loads the real shipped application.yml
      # to catch YAML-nesting mistakes under sentinelops.alerts.* before they reach production.
      #
      # Phase 13 (secure MCP server / approval-gated agent operations): the
      # com.sentinelops.incident.mcp.** and com.sentinelops.incident.proposal.** unit tests also
      # run here automatically — MCP scope mapping, token validation (issuer/audience/signature
      # reuse of the existing JwtDecoder), proposal validation/idempotency/rate-limiting, and
      # approval-service safety properties (self-approval rejection, admin-only dead-letter
      # replay, expiration, content-hash re-verification, stale-incident-version detection, and
      # approval-replay rejection) are all plain JUnit/Mockito tests — no MCP client, network
      # transport, GPU, or paid model is required. McpPropertiesBindingTest loads the real shipped
      # application.yml the same way AlertsPropertiesBindingTest does.
      #
      # Phase 14 (policy-controlled automated remediation engine): the
      # com.sentinelops.incident.remediation.** unit tests also run here automatically — runbook
      # YAML parsing/validation (including the three shipped example runbooks), the deny-by-default
      # policy engine (authorization, blast-radius, maintenance-window, recent-failure, and
      # risk-tier rules), the execution state machine's full transition matrix, and the scheduler's
      # retry/backoff/circuit-breaker/rollback behavior (including the failed-health-check-triggers-
      # automatic-rollback scenario, driven through the same SimulatedDeploymentRepository
      # fault-injection hook the local demo script uses) are all plain JUnit/Mockito tests needing
      # no database, Kubernetes cluster, message broker, or cache. RemediationPropertiesBindingTest
      # loads the real shipped application.yml the same way AlertsPropertiesBindingTest does.
      - name: mvnw verify (unit, security, reliability/idempotency, migration, AI-triage, alert-ingestion, MCP/proposal, and remediation tests)
        working-directory: services/incident-service
        run: ./mvnw -B verify

  telemetry-correlation-service:
    name: telemetry-correlation-service build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/telemetry-correlation-service/pom.xml
      - name: mvnw verify (unit, reliability/idempotency, and migration tests)
        working-directory: services/telemetry-correlation-service
        run: ./mvnw -B verify

  compose-config:
    name: Docker Compose configuration check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare a throwaway .env
        run: cp .env.example .env
      - name: docker compose config
        run: |
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            --profile console --profile app --profile observability --profile benchmark \
            config --quiet

  docker-build:
    name: Docker image build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        service: [incident-service, telemetry-correlation-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build -t "sentinelops/${{ matrix.service }}:ci" services/${{ matrix.service }}
      - name: Record image size (measured evidence, not a target)
        run: |
          docker image inspect "sentinelops/${{ matrix.service }}:ci" \
            --format 'image={{.RepoTags}} size_bytes={{.Size}}'
      - name: Save image as a build artifact for the scan/SBOM jobs
        run: |
          docker save "sentinelops/${{ matrix.service }}:ci" -o "/tmp/${{ matrix.service }}.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1

  # Phase 9: dependency and container-image vulnerability scanning (Trivy — free, open-source).
  # Severity policy (deliberate, documented): fails the build only on CRITICAL/HIGH
  # vulnerabilities that already have a published fix (`ignore-unfixed: true`). A vulnerability
  # with no upstream fix yet cannot be remediated by this repository changing anything, so it is
  # reported (visible in the uploaded scan report artifact) but does not block merges — this is a
  # policy choice, not an oversight; revisit it if a specific unfixed CVE needs tracking
  # differently.
  vulnerability-scan:
    name: Vulnerability scan (${{ matrix.service }})
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        service: [incident-service, telemetry-correlation-service]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Filesystem/dependency scan (pom.xml)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: fs
          scan-ref: services/${{ matrix.service }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy-${{ matrix.service }}-dependencies.txt
          exit-code: "1"
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: image-${{ matrix.service }}
          path: /tmp
      - name: Load the built image
        if: always()
        run: docker load -i "/tmp/${{ matrix.service }}.tar"
      - name: Container image scan
        if: always()
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: image
          image-ref: sentinelops/${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy-${{ matrix.service }}-image.txt
          exit-code: "1"
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports-${{ matrix.service }}
          path: trivy-${{ matrix.service }}-*.txt
          retention-days: 30

  sbom:
    name: SBOM generation (${{ matrix.service }})
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        service: [incident-service, telemetry-correlation-service]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp
      - name: Load the built image
        run: docker load -i "/tmp/${{ matrix.service }}.tar"
      - name: Generate SBOM (CycloneDX, via Syft)
        uses: anchore/sbom-action@v0.17.9
        with:
          image: sentinelops/${{ matrix.service }}:ci
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service }}.cyclonedx.json
          upload-artifact: false
      # Generated reports are CI artifacts only (see Phase 9's own instruction not to commit
      # generated reports unless the repository already tracks such artifacts — it does not).
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cyclonedx.json
          retention-days: 30

  # Phase 8: a short, bounded functional smoke benchmark (single VU, ~30s, see
  # infrastructure/docker/k6/scenarios/smoke.js) runs on every push/PR — it is cheap and catches
  # real regressions in the authenticated request path end to end. Heavier load scenarios
  # (baseline/mixed/burst) deliberately stay opt-in (workflow_dispatch only, see the
  # extended-benchmark job below) rather than gating every PR on a shared runner's timing, which
  # has not been shown stable enough here to justify a strict latency gate.
  benchmark-smoke:
    name: Phase 8 benchmark smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: cp .env.example .env
      - name: Start the app profile
        run: |
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            up -d --wait postgres redis redpanda minio
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            up --exit-code-from redpanda-topics-init redpanda-topics-init
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            up --exit-code-from minio-bucket-init minio-bucket-init
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            --profile app up -d --wait keycloak incident-service
      - name: Run the smoke benchmark
        run: bash infrastructure/docker/scripts/benchmark-run.sh smoke
      - name: Show incident-service logs on failure
        if: failure()
        run: |
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            --profile app logs incident-service keycloak --tail=200
      - name: Tear down
        if: always()
        run: |
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            --profile app down --volumes

  # Opt-in only: triggered manually (workflow_dispatch) with a chosen scenario. Never runs on a
  # normal push/PR, so it never blocks a merge on shared-runner performance variability.
  benchmark-extended:
    name: Phase 8 extended benchmark (opt-in)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.extended_scenario != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: cp .env.example .env
      - name: Start the app profile
        run: |
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            up -d --wait postgres redis redpanda minio
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            up --exit-code-from redpanda-topics-init redpanda-topics-init
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            up --exit-code-from minio-bucket-init minio-bucket-init
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            --profile app up -d --wait keycloak incident-service
      - name: Seed benchmark data (read scenarios only)
        if: contains(fromJSON('["paginated-reads", "mixed-workload"]'), github.event.inputs.extended_scenario)
        run: bash infrastructure/docker/scripts/benchmark-seed.sh ci-run 50 42
      - name: "Run the chosen scenario (bounded: 15 VUs, 30s)"
        env:
          BENCHMARK_VUS: "15"
          BENCHMARK_DURATION: "30s"
          BENCHMARK_RAMP: "5s"
          BENCHMARK_RUN_ID: "ci-run"
        run: bash infrastructure/docker/scripts/benchmark-run.sh "${{ github.event.inputs.extended_scenario }}"
      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.event.inputs.extended_scenario }}
          path: infrastructure/docker/k6/results/
      - name: Tear down
        if: always()
        run: |
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            --profile app down --volumes

  # Phase 9: proves backup/restore actually works, not just that pg_dump exits zero — restores
  # into a disposable database (never the one just seeded) and runs the data-integrity check
  # against the restored copy.
  backup-restore-verify:
    name: Backup, restore verification, and data-integrity check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: cp .env.example .env
      - name: Start Postgres and the incident service
        run: |
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            up -d --wait postgres redis redpanda minio
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            up --exit-code-from redpanda-topics-init redpanda-topics-init
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            --profile app up -d --wait keycloak incident-service
      - name: Seed a small amount of representative data
        run: bash infrastructure/docker/scripts/benchmark-seed.sh ci-backup-check 10 42
      - name: Create a backup
        run: bash infrastructure/docker/scripts/db-backup.sh
      - name: Verify the backup (restore into a disposable database + integrity check)
        run: |
          BACKUP_FILE="$(ls -t infrastructure/docker/backups/*.dump | head -1)"
          bash infrastructure/docker/scripts/db-restore-verify.sh "$BACKUP_FILE"
      - name: Run the data-integrity check against the live database too
        run: bash infrastructure/docker/scripts/integrity-check.sh
      - name: Tear down
        if: always()
        run: |
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            --profile app down --volumes

  # Phase 15: the same drill as dr-exercise.sh's own header — a real backup, simulated
  # post-backup writes, a restore, and a measured RTO/RPO from this run's own numbers. See
  # docs/validation/disaster-recovery.md.
  dr-exercise:
    name: Disaster-recovery exercise (RTO/RPO measurement)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: cp .env.example .env
      - name: Start Postgres and the incident service
        run: |
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            up -d --wait postgres redis redpanda minio
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            up --exit-code-from redpanda-topics-init redpanda-topics-init
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            --profile app up -d --wait keycloak incident-service
      - name: Run the DR exercise
        run: bash infrastructure/docker/scripts/dr-exercise.sh
      - name: Run the MinIO backup/restore verification
        run: bash infrastructure/docker/scripts/minio-backup-restore-verify.sh
      - name: Tear down
        if: always()
        run: |
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            --profile app down --volumes

  # Phase 15: a bounded, safe subset of the chaos-experiment catalog run against the live app
  # profile — proves every experiment stops safely and restores the environment automatically,
  # not just that the script parses. See infrastructure/docker/scripts/chaos/chaos-experiments.yaml.
  chaos-smoke:
    name: Chaos-experiment smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: |
          cp .env.example .env
          echo "CHAOS_EXPERIMENTS_ENABLED=true" >> .env
      - name: Start the full app profile
        run: |
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            up -d --wait postgres redis redpanda minio
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            up --exit-code-from redpanda-topics-init redpanda-topics-init
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            --profile app up -d --wait keycloak incident-service
      - name: kafka-broker-fault (pause/unpause redpanda, verify recovery)
        run: |
          CHAOS_DURATION=10 bash infrastructure/docker/scripts/chaos-experiment.sh kafka-broker-fault
      - name: redis-fault (pause/unpause redis, verify recovery)
        run: |
          CHAOS_DURATION=10 bash infrastructure/docker/scripts/chaos-experiment.sh redis-fault
      - name: pod-termination (bounded restart cycles against incident-service)
        run: |
          CHAOS_CYCLES=2 CHAOS_INTERVAL=5 bash infrastructure/docker/scripts/chaos-experiment.sh pod-termination
      - name: Confirm the stack is healthy after every experiment
        run: |
          curl -fsS http://localhost:8081/actuator/health | grep -q '"status":"UP"'
      - name: Tear down
        if: always()
        run: |
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            --profile app down --volumes

  # Phase 15: static application security testing beyond SpotBugs/Trivy. Runs on push/PR;
  # findings surface in the repository's Security tab. Never blocks on pre-existing findings this
  # phase did not introduce — see docs/validation/security-validation.md's accepted-risk notes.
  codeql:
    name: CodeQL analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [java-kotlin, javascript-typescript]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # Phase 15: secret scanning across the full git history on every push/PR. Fails the job on any
  # detected secret — see .gitleaks.toml for documented, justified allowlist entries only
  # (placeholder/example values, never a real credential).
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Phase 15: OWASP ZAP baseline (passive) scan of the REST API against the running app profile.
  # Passive-only by design — this is CI running against a shared runner, never an active/attack
  # scan, and never against anything but this ephemeral, disposable container stack.
  zap-baseline-scan:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: cp .env.example .env
      - name: Start the full app profile
        run: |
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            up -d --wait postgres redis redpanda minio
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            up --exit-code-from redpanda-topics-init redpanda-topics-init
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            --profile app up -d --wait keycloak incident-service
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8081/actuator/health"
          cmd_options: "-a"
          fail_action: false
      - name: Tear down
        if: always()
        run: |
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            --profile app down --volumes

  # Phase 10: frontend static checks + unit/component tests + production build. Bounded, fast,
  # no backend/Docker dependency (everything here mocks the API — see src/**/*.test.tsx).
  frontend:
    name: Frontend lint, typecheck, unit tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Format check
        working-directory: frontend
        run: npm run format
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Unit/component tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  # Phase 10: a short, bounded, deterministic Playwright smoke test against the real stack — just
  # enough to catch a broken authenticated request path end to end. The full scenario suite
  # (viewer/responder/admin/accessibility — see frontend/e2e/) stays opt-in (workflow_dispatch)
  # since it needs the whole backend stack plus Playwright browsers, too heavy for every PR.
  frontend-e2e-smoke:
    name: Frontend Playwright smoke test (opt-in)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: cp .env.example .env
      - name: Start the app profile
        run: |
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            up -d --wait postgres redis redpanda minio
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            up --exit-code-from redpanda-topics-init redpanda-topics-init
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            --profile app up -d --wait keycloak incident-service
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: Install Playwright's Chromium browser only
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the authentication smoke scenario only
        working-directory: frontend
        run: npx playwright test e2e/auth.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
      - name: Tear down
        if: always()
        run: |
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            --profile app down --volumes

  # Phase 16: lints and renders the Helm chart against every environment overlay, then validates
  # the rendered manifests against the real Kubernetes OpenAPI schema for the pinned
  # kubectl-tools version below (GitHub-hosted runners have no live cluster either, but
  # kubeconform ships its own bundled schema, so this check needs no cluster — unlike this
  # phase's local development sandbox, which had neither a cluster nor kubeconform installed).
  helm-validate:
    name: Helm lint and manifest validation (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        environment: [dev, staging, production]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: helm lint
        run: helm lint infrastructure/helm/sentinelops -f infrastructure/helm/sentinelops/values-${{ matrix.environment }}.yaml
      - name: helm template
        run: |
          helm template sentinelops infrastructure/helm/sentinelops \
            -f infrastructure/helm/sentinelops/values-${{ matrix.environment }}.yaml \
            > /tmp/rendered-${{ matrix.environment }}.yaml
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: Validate rendered manifests against the Kubernetes schema
        run: |
          kubeconform -strict -summary -kubernetes-version 1.31.0 /tmp/rendered-${{ matrix.environment }}.yaml

  # Phase 16: Terraform formatting, validation, and static security analysis. Runs `terraform
  # init -backend=false` (no real state, no credentials needed) against each example
  # environment, and checkov against every module — this is CI's independent confirmation of
  # what could only be hand-reviewed (not tool-verified) in the sandbox this code was authored
  # in, which had neither `terraform` nor `checkov` installed.
  terraform-validate:
    name: Terraform validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        environment: [dev, production]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt -check
        run: terraform fmt -recursive -check infrastructure/terraform
      - name: terraform init (no backend, no credentials)
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform validate
      - name: Static security analysis (checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          soft_fail: true # informational for now — see docs/validation/security-validation.md's accepted-risk notes before hardening to a blocking gate

  # Phase 16: enforces the per-scenario k6 thresholds already declared in every scenario file's
  # own `options.thresholds` (see docs/validation/load-testing.md) as an explicit, separately
  # reported gate — a scenario run here that violates its own declared threshold fails this job,
  # distinct from benchmark-smoke/benchmark-extended's informational sampling.
  performance-regression-gate:
    name: Performance regression gate (k6 smoke thresholds)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: cp .env.example .env
      - name: Start the app profile
        run: |
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            up -d --wait postgres redis redpanda minio
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            up --exit-code-from redpanda-topics-init redpanda-topics-init
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            --profile app up -d --wait keycloak incident-service
      - name: Run the k6 smoke scenario (fails the job if its own thresholds are violated)
        run: bash infrastructure/docker/scripts/benchmark-run.sh smoke
      - name: Tear down
        if: always()
        run: |
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml \
            --profile app down --volumes
